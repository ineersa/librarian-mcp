monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - mcp
        - !php/const App\Operations\RetryLogSubscriber::CHANNEL
    handlers:
        operations:
            # The admin feed must never break an HTTP request or a worker job.
            type: whatfailuregroup
            members: [operations_file]
            channels: ["!deprecation", "!mcp", "!doctrine", "!event"]
        operations_file:
            type: rotating_file
            level: warning
            path: '%app.operations_log_dir%/%env(APP_OPERATIONS_SOURCE)%.log'
            max_files: !php/const App\Operations\OperationsLogReader::RETAINED_FILES
            use_locking: true
            file_permission: 0640
            formatter: App\Operations\OperationsLogFormatter
        mcp:
            # Retain problems, not routine calls or debug tool payloads.
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            max_files: 3
            level: warning
            channels: [mcp]

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 3
                # Retain problems, not normal worker activity or idle SQL polls.
                level: warning
                channels: ["!event", "!deprecation", "!mcp"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!mcp"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!mcp"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            mcp:
                type: stream
                path: php://stderr
                formatter: monolog.formatter.json
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!mcp"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: warning
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!mcp"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
