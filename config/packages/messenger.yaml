framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Observational memory generation (Observer, Reflector + Dropper): long LLM jobs on
            # their own queue and consumer, so indexing and generation never wait on each other.
            # queue_name in options applies because the shared DSN does not set one.
            om:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: om
                # Discovery and model availability failures use native Messenger retries.
                # Session lock contention is deferred separately without a retry stamp.
                retry_strategy:
                    max_retries: 10
                    delay: 30000
                    multiplier: 2
                    max_delay: 540000
                    jitter: 0.1
            # Reflector jobs. The OM consumer polls this transport before `om` after every
            # handled message (`messenger:consume om_reflect om`), so a threshold Reflector job
            # runs before the next queued observe job. Same retry policy as `om`.
            om_reflect:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: om_reflect
                retry_strategy:
                    max_retries: 10
                    delay: 30000
                    multiplier: 2
                    max_delay: 540000
                    jitter: 0.1
            # Cron jobs (daily backup). Redispatched by the `cron` schedule or queued by the admin
            # "Run now" action. Failures are recorded on the cron run and retried by the next
            # schedule tick, so Messenger does not retry.
            cron:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: cron
                retry_strategy:
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
            'App\Message\ScanProjectMessage': async
            'App\Message\IndexProjectMessage': async
            'App\Message\ObserveMemorySessionMessage': om
            'App\Message\ReflectMemoryGenerationMessage': om_reflect
            'App\Message\RunCronJobMessage': cron
