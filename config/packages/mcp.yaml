mcp:
    servers:
        librarian:
            name: 'librarian-mcp'
            version: '1.0.0'
            description: 'Shared Hatfield project memory service'
            instructions: 'Search retained memory with memory_search and recover canonical evidence with recall. Configure the registered absolute project root in X-Librarian-Project and the current OM session in X-Hatfield-Session transport headers. Ranked search hits are not proof of relevance or exhaustive absence; inspect content and recall useful evidence. Importance is source-assigned, not a relevance score. Verify current repository/PR state before acting on historical evidence.'
            protocol_versions:
                - !php/enum Mcp\Schema\Enum\ProtocolVersion::V2026_07_28->value
                - !php/enum Mcp\Schema\Enum\ProtocolVersion::V2025_11_25->value
            transports:
                stdio: false
                http: true
            http:
                path: '/_mcp'
                allowed_hosts: '%env(csv:MCP_ALLOWED_HOSTS)%'
            session:
                store: file
                directory: '%kernel.project_dir%/var/mcp-sessions'
                ttl: 3600
            registry:
                tools: ['App\Mcp\MemoryTools']
