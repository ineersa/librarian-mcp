mcp:
    servers:
        librarian:
            name: 'librarian-mcp'
            version: '1.0.0'
            description: 'Shared Hatfield project memory service'
            instructions: 'Register and scan local Hatfield projects in the admin UI. Memory retrieval tools are not implemented yet.'
            transports:
                stdio: false
                http: true
            http:
                path: '/_mcp'
                allowed_hosts: '%env(csv:MCP_ALLOWED_HOSTS)%'
            session:
                store: file
                directory: '%kernel.project_dir%/var/mcp-sessions'
                ttl: 3600
            registry:
                # The legacy library tools are retired; plan 05 adds memory tools.
                tools: ['App\Mcp\']
