mcp:
    servers:
        librarian:
            name: 'librarian-mcp'
            version: '1.0.0'
            description: 'Librarian MCP HTTP server'
            instructions: 'Use search-libraries to find a library, then semantic-search/grep/read on one library.'
            transports:
                stdio: false
                http: true
            http:
                path: '/_mcp'
                allowed_hosts: '%env(csv:MCP_ALLOWED_HOSTS)%'
            session:
                store: file
                directory: '%kernel.project_dir%/var/mcp-sessions'
                ttl: 3600
            registry:
                - 'App\Mcp\Tool\'
