# yaml-language-server: $schema=../schema.json
# Enable stateless CSRF protection
framework:
    form:
        csrf_protection:
            token_id: submit
    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - switch_user
            # Dashboard forms can be rendered by a worker without an HTTP session.
            - !php/const App\Controller\Admin\DashboardController::MESSENGER_CSRF_ID
