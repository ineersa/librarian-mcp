twig:
    file_name_pattern: '*.twig'
    date:
        timezone: '%app.display_timezone%'
    globals:
        mercure_public_url: '%env(MERCURE_PUBLIC_URL)%'
        site_name: 'Librarian MCP'
        site_short_name: 'Librarian MCP'
        site_description: 'Shared memory service for local Hatfield projects'
        github_url: 'https://github.com/ineersa/librarian-mcp'

when@test:
    twig:
        strict_variables: true
