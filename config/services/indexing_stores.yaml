# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
#
# Index services are explicitly registered; DTOs and per-generation adapters are
# constructed by their owners, not registered as synthetic container services.

parameters:
    app.index.storage_dir: '%kernel.project_dir%/%env(INDEX_STORAGE_DIR)%'
    env(INDEX_STORAGE_DIR): 'data/indexes'
    env(CODERANK_URL): 'http://host.docker.internal:8059/v1'
    env(CODERANK_MODEL): 'CodeRankEmbed'
    env(CODERANK_ARTIFACT): ''
    env(BGE_URL): 'http://host.docker.internal:8060/v1'
    env(BGE_MODEL): 'bge-reranker-base'
    env(CHROMA_HOST): 'http://chroma'
    env(CHROMA_PORT): '8000'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Index\IndexSettings:
        arguments:
            $embeddingUrl: '%env(CODERANK_URL)%'
            $embeddingModel: '%env(CODERANK_MODEL)%'
            $embeddingArtifact: '%env(CODERANK_ARTIFACT)%'
            $rerankerUrl: '%env(BGE_URL)%'
            $rerankerModel: '%env(BGE_MODEL)%'
            $dimensions: 768

    App\Index\MemoryChunker: ~

    App\Index\Store\ChromaClientFactory:
        arguments:
            $host: '%env(CHROMA_HOST)%'
            $port: '%env(int:CHROMA_PORT)%'

    Codewithkyrian\ChromaDB\Client:
        factory: ['@App\Index\Store\ChromaClientFactory', 'create']
        # The client constructor performs tenant/database HTTP requests. Route
        # discovery and static diagnostics must not connect to the backend.
        lazy: true

    # Keep private model requests out of the application's traceable HTTP client.
    # These adapters create a bounded native Symfony HttpClient when passed null.
    App\Index\Model\ValidatingVectorizer:
        arguments:
            $httpClient: null
    App\Index\Model\LocalBgeReranker:
        arguments:
            $httpClient: null

    App\Index\Store\IndexStoreFactory:
        arguments:
            $storageDir: '%app.index.storage_dir%'
            $client: '@Codewithkyrian\ChromaDB\Client'

    App\Index\Search\HybridSearch: ~
