# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
#
# Librarian-owned observational memory (plan 09). One shared model serves the
# Observer, Reflector, and Dropper, as in Hatfield OM. OM_MODEL keeps the exact
# Hatfield provider/model reference because it is a generation identity input.
# The local llama.cpp context window is hardcoded (200k) and must match
# MemoryModelCatalog::LOCAL_CONTEXT_WINDOW; do not reintroduce an env override.

parameters:
    env(OM_MODEL): 'llama_cpp/flash'
    env(OM_MODEL_URL): 'http://host.docker.internal:8052/v1'
    env(OM_MODEL_THINKING_FORMAT): 'llama_cpp'
    env(OM_OBSERVER_CONTEXT_WINDOW_RATIO): '0.65'
    env(OM_REFLECT_AFTER_OBSERVATION_TOKENS): '40000'
    env(OM_OBSERVATIONS_MAX_TOKENS): '30000'
    env(OPENCODE_API_KEY): ''
    env(ZAI_API_KEY): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\ObservationalMemory\MemorySettings:
        arguments:
            $model: '%env(OM_MODEL)%'
            $modelUrl: '%env(OM_MODEL_URL)%'
            $contextWindow: 200000
            $thinkingFormat: '%env(default::OM_MODEL_THINKING_FORMAT)%'
            $observerContextWindowRatio: '%env(float:OM_OBSERVER_CONTEXT_WINDOW_RATIO)%'
            $reflectAfterObservationTokens: '%env(int:OM_REFLECT_AFTER_OBSERVATION_TOKENS)%'
            $observationsMaxTokens: '%env(int:OM_OBSERVATIONS_MAX_TOKENS)%'

    App\ObservationalMemory\Model\MemoryModelCatalog:
        arguments:
            $localModel: '%env(OM_MODEL)%'
            $localModelUrl: '%env(OM_MODEL_URL)%'
            $localThinkingFormat: '%env(default::OM_MODEL_THINKING_FORMAT)%'
