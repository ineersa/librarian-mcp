# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
#
# Domain-owned indexing services. Main owns IndexStoreFactory / HybridSearch /
# scheduler CallbackMessageProvider simplification.

parameters:
    app.index_interval_seconds: '%env(int:INDEX_INTERVAL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Index\Source\CanonicalSourceReader: ~

    App\Index\ProjectIndexManager:
        arguments:
            $indexExecutionLockFactory: '@index_execution_lock_factory'

    App\Index\ProjectIndexer:
        arguments:
            $indexExecutionLockFactory: '@index_execution_lock_factory'

    App\MessageHandler\IndexProjectMessageHandler: ~

    # Main will change the constructor to (ProjectRepository, int) and use
    # CallbackMessageProvider. ProjectRepository remains autowired.
    App\Scheduler\IndexProjectsSchedule:
        arguments:
            $indexIntervalSeconds: '%app.index_interval_seconds%'

    App\Command\IndexProjectCommand: ~
