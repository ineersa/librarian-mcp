services:
  php:
    image: "${COMPOSE_PROJECT_NAME:-librarian-mcp}-php:prod"
    build:
      context: .
      dockerfile: Dockerfile
      target: frankenphp_prod
    restart: unless-stopped
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2019/metrics"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    # Official pgvector image for PostgreSQL 17 (bookworm). Digest verified 2026-11-13.
    image: pgvector/pgvector:pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-librarian}'
      POSTGRES_USER: '${POSTGRES_USER:-librarian}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
