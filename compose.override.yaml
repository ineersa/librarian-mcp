# Castor supplies checkout identity and the private compose network.
name: "${LIBRARIAN_PROJECT:?Run vendor/bin/castor dev:stack:up}"

x-indexing-env: &indexing-env
  CODERANK_URL: '${CODERANK_URL}'
  CODERANK_MODEL: '${CODERANK_MODEL}'
  CODERANK_ARTIFACT: '${CODERANK_ARTIFACT}'
  BGE_URL: '${BGE_URL}'
  BGE_MODEL: '${BGE_MODEL}'
  CHROMA_HOST: '${CHROMA_HOST}'
  CHROMA_PORT: '${CHROMA_PORT}'
  INDEX_STORAGE_DIR: '${INDEX_STORAGE_DIR}'
  INDEX_INTERVAL: '${INDEX_INTERVAL}'
  LOCK_DSN: '${LOCK_DSN}'

services:
  php:
    image: "librarian-${LIBRARIAN_CHECKOUT_ID:?Run vendor/bin/castor dev:stack:up}-php:dev"
    build:
      target: frankenphp_dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: "no"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      SERVER_NAME: ":8080"
      MERCURE_URL: http://127.0.0.1:8080/.well-known/mercure
      MERCURE_PUBLIC_URL: /.well-known/mercure
      MERCURE_CORS_ORIGINS: '${MERCURE_CORS_ORIGINS}'
      MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET}'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_PUBLISHER_JWT_KEY}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_SUBSCRIBER_JWT_KEY}'
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
      MERCURE_EXTRA_DIRECTIVES: |-
        transport bolt {
          path /app/var/mercure-dev.db
        }
      FRANKENPHP_CONFIG: import /etc/caddy/worker.Caddyfile
      PROJECT_BROWSE_ROOT: '${PROJECT_BROWSE_ROOT}'
      HATFIELD_USER_HOME: '${HATFIELD_USER_HOME}'
      HATFIELD_APP_ROOT: '${HATFIELD_APP_ROOT}'
      HATFIELD_PATH_MAPPINGS: '${HATFIELD_PATH_MAPPINGS}'
      <<: *indexing-env
    volumes: !override
      - ./:/app
      - ./docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/frankenphp/worker.Caddyfile:/etc/caddy/worker.Caddyfile:ro
      - ./docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/app.dev.ini:ro
      - type: bind
        source: '${PROJECTS_HOST_PATH:-.}'
        target: /projects
        read_only: true
        bind:
          create_host_path: false
    ports: !override
      - "127.0.0.1:${HTTP_PORT}:8080"
    networks:
      default: {}
      librarian:
        aliases:
          - php
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      chroma:
        condition: service_healthy
    dns:
      - "${DOCKER_DNS_PRIMARY:-1.1.1.1}"
      - "${DOCKER_DNS_SECONDARY:-8.8.8.8}"

  worker:
    image: "librarian-${LIBRARIAN_CHECKOUT_ID:?Run vendor/bin/castor dev:stack:up}-php:dev"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      MERCURE_URL: http://php:8080/.well-known/mercure
      MERCURE_PUBLIC_URL: /.well-known/mercure
      MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET}'
      PROJECT_BROWSE_ROOT: '${PROJECT_BROWSE_ROOT}'
      HATFIELD_USER_HOME: '${HATFIELD_USER_HOME}'
      HATFIELD_APP_ROOT: '${HATFIELD_APP_ROOT}'
      HATFIELD_PATH_MAPPINGS: '${HATFIELD_PATH_MAPPINGS}'
      <<: *indexing-env
    volumes:
      - ./:/app
      - type: bind
        source: '${PROJECTS_HOST_PATH:-.}'
        target: /projects
        read_only: true
        bind:
          create_host_path: false
    # --all includes async + scheduler_default; failed stays excluded.
    command: ['php', 'bin/console', 'messenger:consume', '--all', '--exclude-receivers=failed', '--memory-limit=256M', '--time-limit=3600', '--no-interaction']
    healthcheck:
      disable: true
    depends_on:
      php:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      default: {}
      librarian: {}
    extra_hosts:
      - host.docker.internal:host-gateway
    dns:
      - "${DOCKER_DNS_PRIMARY:-1.1.1.1}"
      - "${DOCKER_DNS_SECONDARY:-8.8.8.8}"

  chroma:
    networks:
      default: {}
      librarian:
        aliases:
          - chroma
    # No published host port; app/worker reach chroma:8000 on the private network.

networks:
  librarian:
    external: true
    name: "${LIBRARIAN_NETWORK:?Run vendor/bin/castor dev:stack:up}"
