# Castor supplies checkout identity and the private compose network.
name: "${LIBRARIAN_PROJECT:?Run vendor/bin/castor dev:stack:up}"

services:
  php:
    image: "librarian-${LIBRARIAN_CHECKOUT_ID:?Run vendor/bin/castor dev:stack:up}-php:dev"
    build:
      target: frankenphp_dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: "no"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      SERVER_NAME: ":8080"
      MERCURE_URL: http://127.0.0.1:8080/.well-known/mercure
      MERCURE_PUBLIC_URL: /.well-known/mercure
      MERCURE_CORS_ORIGINS: '${MERCURE_CORS_ORIGINS}'
      MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET}'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_PUBLISHER_JWT_KEY}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_SUBSCRIBER_JWT_KEY}'
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
      MERCURE_EXTRA_DIRECTIVES: |-
        transport bolt {
          path /app/var/mercure-dev.db
        }
      FRANKENPHP_CONFIG: import /etc/caddy/worker.Caddyfile
      # Vera CLI — container-reachable API endpoints
      EMBEDDING_MODEL_BASE_URL: http://host.docker.internal:${VERA_EMBED_PORT:-8059}/v1
      EMBEDDING_MODEL_ID: ${VERA_EMBED_MODEL:-coderankembed-q8_0.gguf}
      EMBEDDING_MODEL_API_KEY: not-needed
      EMBEDDING_MODEL_QUERY_PREFIX: "Represent this query for searching relevant code:"
      RERANKER_MODEL_BASE_URL: http://host.docker.internal:${VERA_RERANK_PORT:-8060}/v1
      RERANKER_MODEL_ID: ${VERA_RERANK_MODEL:-bge-reranker-base-q8_0.gguf}
      RERANKER_MODEL_API_KEY: not-needed
      VERA_COMPLETION_BASE_URL: http://host.docker.internal:${VERA_COMPLETION_PORT:-8052}/v1
      VERA_COMPLETION_MODEL_ID: ${VERA_COMPLETION_MODEL:-flash}
      VERA_COMPLETION_API_KEY: not-needed
    volumes: !override
      - ./:/app
      - ./docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/frankenphp/worker.Caddyfile:/etc/caddy/worker.Caddyfile:ro
      - ./docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/app.dev.ini:ro
      - ./docker/vera:/root/.vera
      - ./docker/vera:/app/.vera
    ports: !override
      - "127.0.0.1:${HTTP_PORT}:8080"
    networks:
      default: {}
      librarian:
        aliases:
          - php
    extra_hosts:
      - host.docker.internal:host-gateway
    dns:
      - "${DOCKER_DNS_PRIMARY:-1.1.1.1}"
      - "${DOCKER_DNS_SECONDARY:-8.8.8.8}"

  worker:
    image: "librarian-${LIBRARIAN_CHECKOUT_ID:?Run vendor/bin/castor dev:stack:up}-php:dev"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      MERCURE_URL: http://php:8080/.well-known/mercure
      MERCURE_PUBLIC_URL: /.well-known/mercure
      MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET}'
      EMBEDDING_MODEL_BASE_URL: http://host.docker.internal:${VERA_EMBED_PORT:-8059}/v1
      EMBEDDING_MODEL_ID: ${VERA_EMBED_MODEL:-coderankembed-q8_0.gguf}
      EMBEDDING_MODEL_API_KEY: not-needed
      EMBEDDING_MODEL_QUERY_PREFIX: "Represent this query for searching relevant code:"
      RERANKER_MODEL_BASE_URL: http://host.docker.internal:${VERA_RERANK_PORT:-8060}/v1
      RERANKER_MODEL_ID: ${VERA_RERANK_MODEL:-bge-reranker-base-q8_0.gguf}
      RERANKER_MODEL_API_KEY: not-needed
      VERA_COMPLETION_BASE_URL: http://host.docker.internal:${VERA_COMPLETION_PORT:-8052}/v1
      VERA_COMPLETION_MODEL_ID: ${VERA_COMPLETION_MODEL:-flash}
      VERA_COMPLETION_API_KEY: not-needed
    volumes:
      - ./:/app
      - ./docker/vera:/root/.vera
      - ./docker/vera:/app/.vera
    command: ['php', 'bin/console', 'messenger:consume', '--all', '--exclude-receivers=failed', '--memory-limit=256M', '--time-limit=3600', '--no-interaction']
    healthcheck:
      disable: true
    depends_on:
      php:
        condition: service_healthy
    networks:
      default: {}
      librarian: {}
    extra_hosts:
      - host.docker.internal:host-gateway
    dns:
      - "${DOCKER_DNS_PRIMARY:-1.1.1.1}"
      - "${DOCKER_DNS_SECONDARY:-8.8.8.8}"

networks:
  librarian:
    external: true
    name: "${LIBRARIAN_NETWORK:?Run vendor/bin/castor dev:stack:up}"
