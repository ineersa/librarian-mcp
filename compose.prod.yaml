# Production-like / VPS stack: FrankenPHP + SQLite volume.
# Usage: vendor/bin/castor prod:up
#
# Symfony: `.env` + `.env.prod` (+ optional `.env.prod.local` on the build host) are compiled into
# `.env.local.php` in the image via `composer dump-env prod` in the Dockerfile.
#
# Compose loads `.env.prod.local` via `env_file` into each service (no shell `export`). Use it for
# Caddy `{env.MERCURE_*}` / `SERVER_NAME` and any runtime overrides; values override Symfony’s dump
# for the same variable names. Copy `.env.prod.local.dist` → `.env.prod.local`.

x-prod-env-file: &prod-env-file
  env_file:
    - path: .env.prod.local
      required: false

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-json-logging: &json-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Multiline Caddy config; keep in Compose (dotenv is awkward for this block).
x-caddy-inline-env: &caddy-inline-env
  FRANKENPHP_CONFIG: import /etc/caddy/worker.Caddyfile
  MERCURE_CORS_ORIGINS: "${MERCURE_CORS_ORIGINS:-http://localhost http://127.0.0.1 http://localhost:8093 http://127.0.0.1:8093 http://192.168.2.38 http://192.168.2.38:8093 http://server http://server:8093}"
  MERCURE_EXTRA_DIRECTIVES: |-
    transport bolt {
      path /data/mercure.db
    }

services:
  php:
    image: ${APP_IMAGE:-librarian-mcp-php:prod}
    restart: unless-stopped
    <<: [*prod-env-file, *host-gateway, *json-logging]
    environment:
      APP_ENV: prod
      <<: *caddy-inline-env
    volumes:
      - ./data-prod:/app/data-prod
      - caddy_data:/data
      - caddy_config:/config
      - type: bind
        source: '${PROJECTS_HOST_PATH:-.}'
        target: /projects
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app_net
    ports:
      - "${APP_HTTP_BIND:-0.0.0.0}:${APP_HTTP_PORT:-8093}:80"
    dns:
      - "${DOCKER_DNS_PRIMARY:-1.1.1.1}"
      - "${DOCKER_DNS_SECONDARY:-8.8.8.8}"

  messenger:
    image: ${APP_IMAGE:-librarian-mcp-php:prod}
    restart: unless-stopped
    <<: [*prod-env-file, *host-gateway, *json-logging]
    environment:
      APP_ENV: prod
    command: ["php", "bin/console", "messenger:consume", "--all", "--exclude-receivers=failed"]
    depends_on:
      - php
    volumes:
      - ./data-prod:/app/data-prod
      - type: bind
        source: '${PROJECTS_HOST_PATH:-.}'
        target: /projects
        read_only: true
        bind:
          create_host_path: false
    networks:
      - app_net
    dns:
      - "${DOCKER_DNS_PRIMARY:-1.1.1.1}"
      - "${DOCKER_DNS_SECONDARY:-8.8.8.8}"

networks:
  app_net:
    driver: bridge
